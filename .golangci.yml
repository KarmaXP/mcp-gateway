run:
  timeout: 3m
  tests: true

# disable-all: only these linters run. We intentionally do NOT enable gofmt: standard gofmt
# column-aligns '=' in const/var groups; this repo normalizes to a single space before '='
# (make fmt + scripts/normalize-go-eq-spacing.sh). The gofmt linter would always fail on that style.
linters:
  disable-all: true
  enable:
    - bodyclose
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - misspell
    - mnd
    - staticcheck
    - unconvert
    - unused

linters-settings:
  staticcheck:
    checks: ["all"]
  mnd:
    checks:
      - argument
      - case
      - condition
      - operation
      - return

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - bodyclose
        - mnd
