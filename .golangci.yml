run:
  timeout: 3m
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - ineffassign
    - misspell
    - unconvert
    - unused
    # gofmt linter disabled: gofmt column-aligns '=' in grouped const/var; this repo uses
    # single space before '=' (see Makefile fmt + scripts/normalize-go-eq-spacing.sh).
    - bodyclose
    - mnd

linters-settings:
  staticcheck:
    checks: ["all"]
  mnd:
    checks:
      - argument
      - case
      - condition
      - operation
      - return

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - bodyclose
        - mnd
