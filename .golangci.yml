# https://golangci-lint.run/usage/configuration/
run:
  timeout: 3m
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - ineffassign
    - misspell
    - unconvert
    - unused
    - gofmt
    - bodyclose

linters-settings:
  staticcheck:
    checks: ["all"]

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - bodyclose
