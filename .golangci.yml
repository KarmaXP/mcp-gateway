run:
  timeout: 3m
  tests: true

linters:
  enable:
    - govet
    - staticcheck
    - ineffassign
    - misspell
    - unconvert
    - unused
    - gofmt
    - bodyclose
    - mnd

linters-settings:
  staticcheck:
    checks: ["all"]
  mnd:
    checks:
      - argument
      - case
      - condition
      - operation
      - return

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - bodyclose
        - mnd
