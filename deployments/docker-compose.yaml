# Local mcp-gateway stack: Qdrant, ONNX embed, OTel collector, Tempo, Prometheus, Grafana.
# Default: dependencies only (make docker-up). Gateway container: profile gateway (make docker-up-full).
# Profile demo: mock-alpha / mock-beta on 3101/3102 (make docker-up-demo).
# Gateway container (profile gateway) reaches mocks by service name; use --profile demo with --profile gateway.
# Host gateway + compose mocks: published 3101/3102 on localhost (see docs/DEVELOPER.md § Docker networking).
# Profile sre: mock k8s/prom/gh upstreams on 3201–3203 (make docker-up-sre); pair with gateway.sre.example.yaml on host.
# URLs: Grafana :3000 (admin/admin), Prometheus :9090, Qdrant :6333, embed :8001, gateway :8080 (profile).

name: mcp-gateway

networks:
  mcp-gateway-net:
    driver: bridge

volumes:
  qdrant-data:
  tempo-data:
  prometheus-data:
  grafana-data:

services:

  # Qdrant (cosine, 384-d). Published ports are for a gateway running on the host (make run); override via HOST_PORT_* in .env.

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: mcp-gateway-qdrant
    restart: unless-stopped
    ports:
      # HTTP (dashboard + REST).  Override: HOST_PORT_QDRANT_HTTP=16333
      - "${HOST_PORT_QDRANT_HTTP:-6333}:6333"
      # gRPC — used by the gateway when running locally.  Override: HOST_PORT_QDRANT_GRPC=16334
      - "${HOST_PORT_QDRANT_GRPC:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - mcp-gateway-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6333/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ONNX embed sidecar (MiniLM 384-d); model baked at image build.
  embed:
    build:
      context: ./embed
      dockerfile: Dockerfile
    image: mcp-gateway-embed:dev
    container_name: mcp-gateway-embed
    restart: unless-stopped
    environment:
      HF_HUB_OFFLINE: "0" # avoid inheriting HF_HUB_OFFLINE=1 from host; breaks startup with baked model
    ports:
      # Needed when gateway runs locally (make run).  Override: HOST_PORT_EMBED=18001
      - "${HOST_PORT_EMBED:-8001}:8001"
    networks:
      - mcp-gateway-net
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/healthz').read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  # OTel collector: OTLP in from gateway; traces → Tempo, metrics scrape endpoint for Prometheus.
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.120.0
    container_name: mcp-gateway-otel-collector
    restart: unless-stopped
    command: ["--config=/etc/otel/otel-collector.yaml"]
    ports:
      # OTLP gRPC — gateway → collector.  Override: HOST_PORT_OTLP_GRPC=14317
      - "${HOST_PORT_OTLP_GRPC:-4317}:4317"
      # OTLP HTTP — gateway → collector.  Override: HOST_PORT_OTLP_HTTP=14318
      - "${HOST_PORT_OTLP_HTTP:-4318}:4318"
    volumes:
      - ./otel-collector.yaml:/etc/otel/otel-collector.yaml:ro
    networks:
      - mcp-gateway-net
    depends_on:
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:13133/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Tempo: OTLP from collector; metrics_generator remote_writes RED metrics to Prometheus.
  tempo:
    image: grafana/tempo:2.6.1
    container_name: mcp-gateway-tempo
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    networks:
      - mcp-gateway-net
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: mcp-gateway-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yaml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    ports:
      # Override: HOST_PORT_PROMETHEUS=19090
      - "${HOST_PORT_PROMETHEUS:-9090}:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yaml:ro
      - prometheus-data:/prometheus
    networks:
      - mcp-gateway-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  grafana:
    image: grafana/grafana:11.5.2
    container_name: mcp-gateway-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor,metricsSummary
    ports:
      # Override: HOST_PORT_GRAFANA=13000
      - "${HOST_PORT_GRAFANA:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - mcp-gateway-net
    depends_on:
      prometheus:
        condition: service_healthy
      tempo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mock-alpha:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: deployments/mock-mcp/Dockerfile
    image: mcp-gateway-mock:dev
    container_name: mcp-gateway-mock-alpha
    restart: unless-stopped
    command: ["-listen", "0.0.0.0:3101", "-tools", "echo", "-marker", "alpha-ok", "-name", "alpha-upstream"]
    ports:
      - "${HOST_PORT_MOCK_ALPHA:-3101}:3101"
    networks:
      - mcp-gateway-net

  mock-beta:
    profiles: ["demo"]
    build:
      context: ..
      dockerfile: deployments/mock-mcp/Dockerfile
    image: mcp-gateway-mock:dev
    container_name: mcp-gateway-mock-beta
    restart: unless-stopped
    command: ["-listen", "0.0.0.0:3102", "-tools", "echo,ping", "-marker", "beta-ok", "-name", "beta-upstream"]
    ports:
      - "${HOST_PORT_MOCK_BETA:-3102}:3102"
    networks:
      - mcp-gateway-net

  mock-k8s:
    profiles: ["sre"]
    build:
      context: ..
      dockerfile: deployments/mock-mcp/Dockerfile
    image: mcp-gateway-mock:dev
    container_name: mcp-gateway-mock-k8s
    restart: unless-stopped
    command: ["-listen", "0.0.0.0:3201", "-tools", "get_pod_logs,list_pods,describe_pod,list_events", "-marker", "k8s-ok", "-name", "k8s-upstream"]
    ports:
      - "${HOST_PORT_MOCK_K8S:-3201}:3201"
    networks:
      - mcp-gateway-net

  mock-prom:
    profiles: ["sre"]
    build:
      context: ..
      dockerfile: deployments/mock-mcp/Dockerfile
    image: mcp-gateway-mock:dev
    container_name: mcp-gateway-mock-prom
    restart: unless-stopped
    command: ["-listen", "0.0.0.0:3202", "-tools", "query_instant,query_range,alerts,targets", "-marker", "prom-ok", "-name", "prom-upstream"]
    ports:
      - "${HOST_PORT_MOCK_PROM:-3202}:3202"
    networks:
      - mcp-gateway-net

  mock-gh:
    profiles: ["sre"]
    build:
      context: ..
      dockerfile: deployments/mock-mcp/Dockerfile
    image: mcp-gateway-mock:dev
    container_name: mcp-gateway-mock-gh
    restart: unless-stopped
    command: ["-listen", "0.0.0.0:3203", "-tools", "list_prs,get_pr", "-marker", "gh-ok", "-name", "gh-upstream"]
    ports:
      - "${HOST_PORT_MOCK_GH:-3203}:3203"
    networks:
      - mcp-gateway-net

  # Gateway (profile gateway); local dev usually uses make run instead.
  gateway:
    profiles: ["gateway"]
    build:
      context: ..
      dockerfile: Dockerfile
    image: mcp-gateway:dev
    container_name: mcp-gateway-app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PORT: "8080" # fixed in-container; map host with HOST_PORT_GATEWAY (ignore host .env PORT)
      AUTH_MODE: "${AUTH_MODE:-none}"
      MCP_GATEWAY_CONFIG: /etc/mcp-gateway/gateway.yaml
      # router.mode comes from mounted gateway.yaml; set ROUTER_MODE in .env only to override.
      QDRANT_URL: http://qdrant:6333
      EMBED_URL: http://embed:8001
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    volumes:
      - ./gateway.example.docker.yaml:/etc/mcp-gateway/gateway.yaml:ro
    ports:
      # Override: HOST_PORT_GATEWAY=9090
      - "${HOST_PORT_GATEWAY:-8080}:8080"
    networks:
      - mcp-gateway-net
    depends_on:
      qdrant:
        condition: service_healthy
      embed:
        condition: service_healthy
      otel-collector:
        condition: service_healthy
      mock-alpha:
        condition: service_started
        required: false
      mock-beta:
        condition: service_started
        required: false
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/healthz >/dev/null && wget -qO- http://localhost:8080/readyz >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
