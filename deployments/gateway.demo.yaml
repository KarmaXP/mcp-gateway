# Minimal plug-and-play config: one local MCP upstream (cmd/smoke_upstream on :31400).
# Used by: make demo, make run (default), MCP_GATEWAY_CONFIG in quick start.
#
# Multi-backend example: deployments/gateway.example.yaml (run make demo-upstreams first).

backends:
  - id: smoke
    prefix: smoke
    url: http://127.0.0.1:31400
    max_concurrency: 4

router:
  mode: off

qdrant:
  collection: mcp_tool_catalog

embed:
  url: http://127.0.0.1:8001
