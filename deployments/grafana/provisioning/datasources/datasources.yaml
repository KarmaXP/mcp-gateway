apiVersion: 1

datasources:

  # ---------------------------------------------------------------------------
  # Prometheus — gateway metrics (histograms, counters, RED metrics from Tempo)
  # ---------------------------------------------------------------------------
  - name: Prometheus
    type: prometheus
    uid: prometheus
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      # Link metric exemplars back to Tempo traces
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: tempo

  # ---------------------------------------------------------------------------
  # Grafana Tempo — distributed traces (replaces Jaeger)
  # Enables TraceQL queries and auto-links traces → metrics in Grafana.
  # ---------------------------------------------------------------------------
  - name: Tempo
    type: tempo
    uid: tempo
    url: http://tempo:3200
    editable: false
    jsonData:
      httpMethod: GET
      # Link trace spans to Prometheus service graph metrics
      serviceMap:
        datasourceUid: prometheus
      # Enable node graph view
      nodeGraph:
        enabled: true
      # Enable TraceQL search
      search:
        hide: false
      spanBar:
        type: Duration
