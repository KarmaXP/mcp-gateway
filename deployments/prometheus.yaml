# =============================================================================
# Prometheus — scrape configuration
#
# Sources:
#   otel-collector :8889  — gateway metrics (OTLP → Prometheus exporter)
#   tempo (remote_write)  — RED metrics generated by Tempo metrics_generator
#
# remote_write from Tempo is accepted via --web.enable-remote-write-receiver
# (passed in docker-compose.yaml command flags, no config needed here).
# =============================================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

scrape_configs:

  # MCP Gateway metrics forwarded by the OTel Collector's Prometheus exporter.
  # This is the primary source for gateway internal latency histograms (§D.2).
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Prometheus self-scrape (optional but useful for infra health)
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Direct scrape of the gateway /metrics endpoint once implemented.
  # Disabled by default; uncomment when the gateway exposes /metrics.
  # - job_name: "mcp-gateway"
  #   static_configs:
  #     - targets: ["gateway:8080"]
  #   metrics_path: /metrics
