# Scrapes otel-collector:8889. Tempo pushes RED metrics via remote_write (compose enables receiver).

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

scrape_configs:
  - job_name: "otel-collector"
    static_configs:
      - targets: ["otel-collector:8889"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # - job_name: "mcp-gateway"
