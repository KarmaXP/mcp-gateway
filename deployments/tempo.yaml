# =============================================================================
# Grafana Tempo — distributed tracing backend
#
# Receives OTLP from the OTel Collector (internal :4317 / :4318).
# Generates RED metrics (rate/error/duration) via metrics_generator and pushes
# them to Prometheus via remote_write — enables trace↔metric correlation
# in Grafana without a separate instrumentation layer.
# =============================================================================

server:
  http_listen_port: 3200
  log_level: info

# ---------------------------------------------------------------------------
# Distributor: accept OTLP traces from the OTel Collector
# ---------------------------------------------------------------------------
distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

# ---------------------------------------------------------------------------
# Ingester: buffer traces before flushing to storage
# ---------------------------------------------------------------------------
ingester:
  trace_idle_period: 10s
  max_block_bytes: 1_000_000
  max_block_duration: 5m

# ---------------------------------------------------------------------------
# Compactor: manage block retention
# ---------------------------------------------------------------------------
compactor:
  compaction:
    block_retention: 24h

# ---------------------------------------------------------------------------
# Storage: local filesystem (swap for GCS/S3 in production)
# ---------------------------------------------------------------------------
storage:
  trace:
    backend: local
    wal:
      path: /var/tempo/wal
    local:
      path: /var/tempo/blocks

# ---------------------------------------------------------------------------
# Metrics generator: derives RED metrics from trace spans and pushes them to
# Prometheus via remote_write. Enables "Traces → Metrics" in Grafana.
# ---------------------------------------------------------------------------
metrics_generator:
  registry:
    external_labels:
      source: tempo
      service: mcp-gateway
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true   # Attach trace IDs to metric exemplars

overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs    # Request rate, error rate, latency between services
        - span-metrics      # Per-span histograms aligned with mcp.* naming

# ---------------------------------------------------------------------------
# Query frontend
# ---------------------------------------------------------------------------
querier:
  max_concurrent_queries: 20

query_frontend:
  max_retries: 2
