openapi: 3.1.0
info:
  title: MCP Gateway HTTP API
  description: |
    Host-facing HTTP surface for the MCP multiplexing gateway (Phase 1).

    - **SSE**: long-lived `GET /mcp/sse` stream; responses carry `Mcp-Session-Id`.
    - **JSON-RPC**: single request per `POST /mcp/rpc` with `Mcp-Session-Id` echo header.
    - JSON-RPC **responses** for requests with an `id` are delivered asynchronously as SSE events
      (`event: jsonrpc`, `data: { ... }`), not in the POST response body.

    When `AUTH_MODE=jwt`, all routes except configured health prefixes require a valid `Authorization: Bearer` JWT.

    ### JSON-RPC error codes (gateway contract)

    Errors delivered on the SSE stream (`event: jsonrpc`) use JSON-RPC 2.0 `error.code` values.
    The gateway defines constants in `internal/gateway/errcodes`:

    | Code | Name | Meaning |
    |------|------|---------|
    | -32601 | `MethodNotFound` | Method not supported on this session. |
    | -32602 | `InvalidParams` | Malformed or invalid `params` (e.g. `tools/call`). |
    | -32603 | `InternalError` | Standard JSON-RPC server error (reserved by spec). |
    | -32000 | `GatewayInternal` | Upstream/aggregate failure, transport error, or initialize/tools failure. |
    | -32001 | `HandshakeIncomplete` | `tools/*` before `initialize` + `notifications/initialized`. |
    | -32002 | `RequestRejected` | Middleware or policy rejected the request. |
    | -32004 | `ToolRoutingAmbiguous` | Semantic router could not pick a unique tool (threshold, ambiguity, rename policy). |

    The numeric band `-32003` is intentionally unused (gap) to keep alignment with documented thesis ranges; do not rely on it.
  version: 0.1.0
  license:
    name: Proprietary
servers:
  - url: http://localhost:18080
    description: Local default (see PORT / GATEWAY_PORT in .env)
  - url: http://localhost:8080
    description: Docker gateway profile default

tags:
  - name: Health
  - name: MCP
  - name: JSON-RPC

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getHealthz
      responses:
        "200":
          description: Process is up
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Phase 1 — no external dependency checks; returns OK when process serves traffic.
      operationId: getReadyz
      responses:
        "200":
          description: Ready to accept traffic
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /mcp/sse:
    get:
      tags: [MCP]
      summary: Open MCP host SSE session
      description: |
        Opens a **Server-Sent Events** stream. The gateway assigns a session id returned in the
        `Mcp-Session-Id` response header. The client MUST send this value on every `POST /mcp/rpc`.

        While this connection stays open, JSON-RPC **results** and **errors** (for requests that include `id`)
        are written as SSE events:

        ```
        event: jsonrpc
        data: {"jsonrpc":"2.0","id":1,"result":{...}}

        ```
      operationId: openMcpSSE
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Stream established
          headers:
            Mcp-Session-Id:
              description: UUID for this session; required on subsequent POST /mcp/rpc
              schema:
                type: string
                format: uuid
            Content-Type:
              schema:
                type: string
                example: text/event-stream
          content:
            text/event-stream:
              schema:
                type: string
                description: SSE stream of `event: jsonrpc` frames
        "401":
          description: Missing or invalid JWT (when AUTH_MODE=jwt)
        "500":
          description: Streaming not supported by server

  /mcp/rpc:
    post:
      tags: [MCP, JSON-RPC]
      summary: Submit a single JSON-RPC 2.0 request
      description: |
        Body MUST be one JSON object. For **notifications** (no `id`), the server returns `202` with no body
        when accepted. For **requests** (`id` present), the server returns `202 Accepted` immediately; the
        JSON-RPC **response** is delivered on the open SSE connection for the same session.

        Supported methods (Phase 1): `initialize`, `notifications/initialized` (or `initialized`),
        `tools/list`, `tools/call`. Other methods receive a JSON-RPC error on the SSE stream.
      operationId: postMcpRpc
      security:
        - bearerAuth: []
      parameters:
        - name: Mcp-Session-Id
          in: header
          required: true
          description: Value from `GET /mcp/sse` response header
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequest"
            examples:
              initialize:
                summary: MCP initialize
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: "2024-11-05"
                    capabilities: {}
                    clientInfo:
                      name: demo-client
                      version: "1.0.0"
              notificationsInitialized:
                summary: Initialized notification
                value:
                  jsonrpc: "2.0"
                  method: notifications/initialized
              toolsList:
                summary: List aggregated tools
                value:
                  jsonrpc: "2.0"
                  id: 3
                  method: tools/list
              toolsCall:
                summary: Call a namespaced tool
                value:
                  jsonrpc: "2.0"
                  id: 4
                  method: tools/call
                  params:
                    name: alpha__echo
                    arguments: {}
      responses:
        "202":
          description: Request accepted for processing; response follows on SSE (if `id` was set)
        "400":
          description: Missing session header, invalid body, or invalid JSON-RPC envelope
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Unauthorized (JWT mode)
        "404":
          description: Unknown `Mcp-Session-Id`
        "500":
          description: Dispatch failure

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: RS256 JWT when AUTH_MODE=jwt (optional in dev when AUTH_MODE=none)

  schemas:
    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        method:
          type: string
          description: MCP / JSON-RPC method name
        params:
          description: Method-specific parameters (object); may be omitted for some methods
          oneOf:
            - type: object
            - type: "null"
        id:
          description: Omitted for notifications; must not be JSON null
          oneOf:
            - type: string
            - type: integer

    JsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          description: Present for responses to requests; echoes request id
          oneOf:
            - type: string
            - type: integer
        result:
          description: Present on success
        error:
          $ref: "#/components/schemas/JsonRpcError"

    JsonRpcError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: |
            JSON-RPC error code. Must match `internal/gateway/errcodes` for gateway-generated errors:

            - **-32601** — `MethodNotFound`
            - **-32602** — `InvalidParams`
            - **-32603** — `InternalError` (spec reserved)
            - **-32000** — `GatewayInternal`
            - **-32001** — `HandshakeIncomplete`
            - **-32002** — `RequestRejected`
            - **-32004** — `ToolRoutingAmbiguous`

            Values **-32003** and other `-32005..-32099` are reserved for future gateway use.
        message:
          type: string
        data:
          description: Optional structured detail
