openapi: 3.1.0
info:
  title: MCP Gateway HTTP API
  description: |
    Host-facing HTTP surface for the MCP multiplexing gateway: **one SSE session** pairs with
    **many stateless POSTs** carrying JSON-RPC envelopes.

    ### End-to-end flow (host client)

    1. **Open stream** — `GET /mcp/sse` with `Accept: text/event-stream`. The gateway responds `200`
       and sets response header **`Mcp-Session-Id`** (UUID). Keep this connection open for the whole session.
    2. **Send RPC** — For each JSON-RPC message, `POST /mcp/rpc` with body = one JSON object and request header
       **`Mcp-Session-Id`** equal to the value from step 1. Use `Content-Type: application/json`.
    3. **Read replies** — For requests that include an `id`, the gateway does **not** return the JSON-RPC
       result in the POST body. Instead it responds **`202 Accepted`** immediately (empty body). The
       matching **result** or **error** object is delivered on the SSE connection as a **W3C SSE** frame:
       named event **`jsonrpc`** (`event: jsonrpc`) and one **`data:`** line containing a single-line JSON
       object matching `JsonRpcResponse` (no literal newlines inside the JSON).
    4. **Handshake** — After `initialize` (response on SSE), send notification `notifications/initialized`
       (or `initialized`) with no `id` before calling `tools/list` or `tools/call`; otherwise the gateway
       returns error code **-32001** (`HandshakeIncomplete`) on the SSE stream.
    5. **Shutdown** — Closing the SSE connection cancels in-flight work tied to that session; the gateway
       merges process shutdown context so SIGTERM drains streams cleanly.

    - **SSE**: long-lived `GET /mcp/sse`; **`Mcp-Session-Id` is only on the GET response** (clients copy it onto every POST).
    - **JSON-RPC**: single request per `POST /mcp/rpc`; responses for requests with `id` are **SSE-only**.

    When `AUTH_MODE=jwt`, **`GET /mcp/sse`** and **`POST /mcp/rpc`** require `Authorization: Bearer <JWT>` (health routes are skipped by default).

    Optional headers (all routes): **`traceparent`** / **`tracestate`** (W3C Trace Context). When `traceparent` is present, the gateway continues the distributed trace for OTel spans. Omitted headers are safe.

    ### HTTP status vs transport errors (ingress)

    JSON-RPC **application** errors (e.g. `-32003` `PermissionDenied`) are delivered on the **SSE** stream, not in the POST body. HTTP status reflects transport / gatekeeping only:

    | HTTP | Meaning |
    |------|---------|
    | **200** | `GET /mcp/sse` stream established. |
    | **202** | `POST /mcp/rpc` accepted; for requests with `id`, see SSE `event: jsonrpc`. |
    | **400** | Missing session header, unreadable body, or invalid JSON-RPC envelope. |
    | **401** | JWT missing/invalid, or JWT claims could not be merged with policy (fail-closed). |
    | **404** | Unknown `Mcp-Session-Id`. |
    | **413** | Request body over gateway limit. |
    | **429** | Rate limited (when enabled). |
    | **500** | Dispatch or streaming failure. |

    ### JSON-RPC error codes (gateway contract)

    Errors delivered on the SSE stream (`event: jsonrpc`) use JSON-RPC 2.0 `error.code` values.
    The gateway defines constants in `internal/gateway/errcodes`:

    | Code | Name | Meaning |
    |------|------|---------|
    | -32601 | `MethodNotFound` | Method not supported on this session. |
    | -32602 | `InvalidParams` | Malformed or invalid `params` (e.g. `tools/call`). |
    | -32603 | `InternalError` | Standard JSON-RPC server error (reserved by spec). |
    | -32000 | `GatewayInternal` | Upstream/multiplex failure, transport error, or initialize/tools failure. |
    | -32001 | `HandshakeIncomplete` | `tools/*` before `initialize` + `notifications/initialized`. |
    | -32002 | `RequestRejected` | Session middleware rejected the request (e.g. handshake guard). |
    | -32003 | `PermissionDenied` | Authenticated principal is not allowed to invoke the requested tool (`tools/call`). |
    | -32004 | `ToolRoutingAmbiguous` | Semantic router could not pick a unique tool (threshold, ambiguity, rename policy). |

    Other bands in `-32005..-32099` remain reserved for future gateway use.
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://localhost:18080
    description: Local default (see PORT / GATEWAY_PORT in .env)
  - url: http://localhost:8080
    description: Docker gateway profile default

tags:
  - name: Health
    description: Liveness and readiness without MCP session semantics
  - name: MCP
    description: SSE session and JSON-RPC ingress
  - name: JSON-RPC
    description: Request and error shapes for MCP methods

paths:
  /healthz:
    get:
      tags: [Health]
      summary: Liveness probe
      operationId: getHealthz
      security: []
      responses:
        "200":
          description: Process is up
          content:
            text/plain:
              schema:
                type: string
                example: ok
  /readyz:
    get:
      tags: [Health]
      summary: Readiness probe
      description: Phase 1 — no external dependency checks; returns OK when process serves traffic.
      operationId: getReadyz
      security: []
      responses:
        "200":
          description: Ready to accept traffic
          content:
            text/plain:
              schema:
                type: string
                example: ok

  /mcp/sse:
    get:
      tags: [MCP]
      summary: Open MCP host SSE session
      description: |
        Opens a **Server-Sent Events** stream. The gateway assigns a session id returned in the
        `Mcp-Session-Id` response header. The client MUST send this value on every `POST /mcp/rpc`.

        While this connection stays open, JSON-RPC **results** and **errors** (for requests that include `id`)
        are written as **W3C Server-Sent Events** using the fixed event name **`jsonrpc`** (see `SseJsonRpcFrame`).
      operationId: openMcpSSE
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Tracestate"
      responses:
        "200":
          description: Stream established
          headers:
            Mcp-Session-Id:
              description: UUID for this session; required on subsequent POST /mcp/rpc
              schema:
                type: string
                format: uuid
            Content-Type:
              schema:
                type: string
                example: text/event-stream
          content:
            text/event-stream:
              schema:
                $ref: "#/components/schemas/SseJsonRpcFrame"
              examples:
                initializeResult:
                  summary: Example SSE data line after initialize
                  value: |
                    event: jsonrpc
                    data: {"jsonrpc":"2.0","id":1,"result":{"protocolVersion":"2024-11-05","capabilities":{},"serverInfo":{"name":"mcp-gateway"}}}

                    event: jsonrpc
                    data: {"jsonrpc":"2.0","id":4,"error":{"code":-32001,"message":"handshake incomplete: send initialize then notifications/initialized"}}
        "401":
          description: Missing or invalid JWT (when AUTH_MODE=jwt)
        "500":
          description: Streaming not supported by server

  /mcp/rpc:
    post:
      tags: [MCP, JSON-RPC]
      summary: Submit a single JSON-RPC 2.0 request
      description: |
        Body MUST be one JSON object. For **notifications** (no `id`), the server returns `202` with no body
        when accepted. For **requests** (`id` present), the server returns `202 Accepted` immediately; the
        JSON-RPC **response** is delivered on the open SSE connection for the same session.

        Supported methods (Phase 1–2 baseline): `initialize`, `ping`, `notifications/initialized` (or `initialized`),
        `tools/list`, `tools/call`. Other methods receive a JSON-RPC error on the SSE stream.

        Optional header **`X-MCP-Intent`**: free-text session or user intent; forwarded to the semantic router for
        **`tools/call`** and, when `ROUTER_MODE=filter_list`, for **`tools/list`** subsetting (see README).

        When **`AUTH_MODE=jwt`**, optional claims **`mcp_tools`**, **`authorization_details`**, and **`mcp_tool_groups`**
        filter **`tools/list`** and reject **`tools/call`** outside the effective allow list (**-32003** on SSE); see `bearerAuth` and schema **`AuthorizationDetailsMcpTool`**.
      operationId: postMcpRpc
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/Traceparent"
        - $ref: "#/components/parameters/Tracestate"
        - name: Mcp-Session-Id
          in: header
          required: true
          description: Value from `GET /mcp/sse` response header
          schema:
            type: string
            format: uuid
        - name: X-MCP-Intent
          in: header
          required: false
          description: |
            Optional natural-language intent for **semantic routing** on `tools/call` (forwarded as router intent text).
            Safe to omit for exact tool names or when the router is disabled.
          schema:
            type: string
            example: List pods in the production namespace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JsonRpcRequest"
            examples:
              initialize:
                summary: MCP initialize
                value:
                  jsonrpc: "2.0"
                  id: 1
                  method: initialize
                  params:
                    protocolVersion: "2024-11-05"
                    capabilities: {}
                    clientInfo:
                      name: demo-client
                      version: "1.0.0"
              notificationsInitialized:
                summary: Initialized notification
                value:
                  jsonrpc: "2.0"
                  method: notifications/initialized
              toolsList:
                summary: List aggregated tools
                value:
                  jsonrpc: "2.0"
                  id: 3
                  method: tools/list
              toolsCallAllow:
                summary: tools/call — allowed tool (host must be allow-listed when using JWT)
                value:
                  jsonrpc: "2.0"
                  id: 4
                  method: tools/call
                  params:
                    name: alpha__echo
                    arguments: {}
              toolsCallDeny:
                summary: tools/call — denied tool (SSE delivers error -32003; no upstream forward)
                description: |
                  Example when JWT effective allow list includes only `alpha__echo` but the host calls `alpha__other`.
                  HTTP **202** on POST; SSE `data` line contains `JsonRpcError` with `code: -32003`.
                value:
                  jsonrpc: "2.0"
                  id: 5
                  method: tools/call
                  params:
                    name: alpha__other
                    arguments: {}
              ping:
                summary: MCP ping (empty result object)
                value:
                  jsonrpc: "2.0"
                  id: 2
                  method: ping
      responses:
        "202":
          description: |
            Request accepted. If the body was a **request** (JSON field `id` present), the JSON-RPC
            **response** (`result` or `error`) is emitted only on the open SSE session as `event: jsonrpc`.
            If the body was a **notification** (no `id`), no SSE reply is expected.
        "400":
          description: Missing session header, invalid body, or invalid JSON-RPC envelope
          content:
            text/plain:
              schema:
                type: string
        "401":
          description: Unauthorized (JWT mode)
        "404":
          description: Unknown `Mcp-Session-Id`
        "413":
          description: Request body exceeds the gateway maximum (enforced with `MaxBytesReader` before buffering)
        "429":
          description: Rate limit exceeded when `RATE_LIMIT_ENABLED` is set
        "500":
          description: Dispatch failure

components:
  parameters:
    Traceparent:
      name: traceparent
      in: header
      required: false
      description: |
        [W3C Trace Context](https://www.w3.org/TR/trace-context/) `traceparent`. Optional; when set, gateway spans link to this trace.
      schema:
        type: string
        example: 00-0af7651916cd43dd8448eb211c80319c-b7ad6b7169203331-01
    Tracestate:
      name: tracestate
      in: header
      required: false
      description: Optional `tracestate` vendor data per W3C Trace Context.
      schema:
        type: string

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        **Algorithm:** RS256 only (gateway validates with **`JWT_PUBLIC_KEY_PEM`** or **`JWT_JWKS_URL`**).

        **Registered claims (validated when configured via env):**
        - **`iss`**: must match **`JWT_ISS`** when set.
        - **`aud`**: must include **`JWT_AUD`** when set (string match against claim array).
        - **`exp`**: required; expired tokens are rejected (**401**).

        **MCP / policy claims (optional):**
        - **`mcp_tools`**: JSON array of namespaced tool ids (e.g. `["alpha__echo"]`). Merged with RAR-derived tools by **intersection** when both are present. Enforced on **`tools/list`** (subset) and **`tools/call`** (**-32003** on SSE if not allowed).
        - **`mcp_tool_groups`**: array of group keys resolved against gateway YAML `policy.tool_groups`.
        - **`authorization_details`**: JSON array of **`AuthorizationDetailsMcpTool`** objects (RFC 9396–style). Non-`mcp_tool` types are ignored by this gateway.

        **Upstream MCP HTTP:** the gateway may inject **`traceparent`** on backend `POST /mcp/rpc`; MCP servers may ignore it.

  schemas:
    AuthorizationDetailsMcpTool:
      type: object
      description: |
        One element of JWT claim **`authorization_details`** for type **`mcp_tool`** (see `internal/policy/rar.go`).
        Use exactly one of **`tool_name`** (exact namespaced id) or **`tool_pattern`** (glob: `*`, `?`, `[]`, `filepath.Match` semantics).
        **`tool_name`** and **`tool_pattern`** are mutually exclusive; payloads that set both are rejected when the policy engine parses claims.
      required: [type]
      properties:
        type:
          type: string
          enum: [mcp_tool]
        tool_name:
          type: string
          description: Exact namespaced tool id (e.g. `alpha__echo`). Omit when using `tool_pattern`.
        tool_pattern:
          type: string
          description: Glob pattern (e.g. `alpha__*`). Omit when using `tool_name`.
      example:
        type: mcp_tool
        tool_name: alpha__echo

    SseJsonRpcFrame:
      type: string
      description: |
        One SSE event delivered as two lines, then a blank line:
        `event: jsonrpc` and `data: ` + serialized [`JsonRpcResponse`](#/components/schemas/JsonRpcResponse) (single line, no literal newlines inside JSON).
      example: |
        event: jsonrpc
        data: {"jsonrpc":"2.0","id":1,"result":{"protocolVersion":"2024-11-05","capabilities":{},"serverInfo":{"name":"mcp-gateway"}}}

    JsonRpcRequest:
      type: object
      required: [jsonrpc, method]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        method:
          type: string
          description: MCP / JSON-RPC method name
        params:
          description: Method-specific parameters (object); may be omitted for some methods
          oneOf:
            - type: object
            - type: "null"
        id:
          description: Omitted for notifications; must not be JSON null
          oneOf:
            - type: string
            - type: integer

    JsonRpcResponse:
      type: object
      required: [jsonrpc]
      properties:
        jsonrpc:
          type: string
          enum: ["2.0"]
        id:
          description: Present for responses to requests; echoes request id
          oneOf:
            - type: string
            - type: integer
        result:
          description: Present on success
        error:
          $ref: "#/components/schemas/JsonRpcError"

    JsonRpcError:
      type: object
      required: [code, message]
      properties:
        code:
          type: integer
          description: |
            JSON-RPC error code. Must match `internal/gateway/errcodes` for gateway-generated errors:

            - **-32601** — `MethodNotFound`
            - **-32602** — `InvalidParams`
            - **-32603** — `InternalError` (spec reserved)
            - **-32000** — `GatewayInternal`
            - **-32001** — `HandshakeIncomplete`
            - **-32002** — `RequestRejected`
            - **-32003** — `PermissionDenied`
            - **-32004** — `ToolRoutingAmbiguous`

            Values in `-32005..-32099` are reserved for future gateway use.
        message:
          type: string
        data:
          description: Optional structured detail
